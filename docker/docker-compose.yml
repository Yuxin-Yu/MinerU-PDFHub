version: '3.8'

services:
  mineru-pdfhub:
    image: mineru-pdfhub:latest
    container_name: mineru-pdfhub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mineru-pdfhub-config:/config
      - mineru-pdfhub-data:/data
    environment:
      - MINERU_PDFHUB_TRANSPORT=http
      - MINERU_PDFHUB_ENABLE_AUTH=false
      - MINERU_PDFHUB_HOST=0.0.0.0
      # 可根据需要添加更多环境变量
      # - MINERU_PDFHUB_CONFIG_DIR=/config
      # - MINERU_PDFHUB_DATA_DIR=/data
      # - MINERU_PDFHUB_PORT=8080
      # - MINERU_PDFHUB_API_KEYS=your-api-key
      # - MINERU_PDFHUB_ALLOWED_IPS=192.168.1.0/24
      # - MINERU_PDFHUB_GIT_AUTOSYNC=true
      # - MINERU_PDFHUB_GIT_SYNC_MINUTES=60
      # - MINERU_PDFHUB_ENABLE_BACKUPS=true
      # - MINERU_PDFHUB_MULTI_USER=false
    networks:
      - mineru-pdfhub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mineru-pdfhub-config:
    driver: local
  mineru-pdfhub-data:
    driver: local

networks:
  mineru-pdfhub-net:
    driver: bridge