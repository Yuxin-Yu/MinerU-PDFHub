version: '3.8'

services:
  mineru-pdfhub:
    image: mineru-pdfhub:latest
    container_name: mineru-pdfhub-prod
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - mineru-pdfhub-config:/config
      - mineru-pdfhub-data:/data
      - /etc/localtime:/etc/localtime:ro  # 同步主机时间
    environment:
      - MINERU_PDFHUB_TRANSPORT=http
      - MINERU_PDFHUB_ENABLE_AUTH=true  # 生产环境启用认证
      - MINERU_PDFHUB_API_KEYS=${MINERU_PDFHUB_API_KEYS}  # 从环境变量获取API密钥
      - MINERU_PDFHUB_ALLOWED_IPS=${MINERU_PDFHUB_ALLOWED_IPS:-0.0.0.0/0}  # 从环境变量获取允许的IP
      - MINERU_PDFHUB_GIT_AUTOSYNC=true  # 启用Git自动同步
      - MINERU_PDFHUB_GIT_SYNC_MINUTES=${MINERU_PDFHUB_GIT_SYNC_MINUTES:-60}  # 同步间隔
      - MINERU_PDFHUB_ENABLE_BACKUPS=true  # 启用备份
      - MINERU_PDFHUB_BACKUP_DIR=/data/backups
      - MINERU_PDFHUB_MULTI_USER=true  # 启用多用户
      - MINERU_PDFHUB_USERS_FILE=/config/users.yaml
      - MINERU_PDFHUB_ROLES_FILE=/config/roles.yaml
    networks:
      - mineru-pdfhub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true  # 只读文件系统，提高安全性
    tmpfs:
      - /tmp  # 临时目录使用tmpfs
      - /var/tmp  # 临时目录使用tmpfs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes: