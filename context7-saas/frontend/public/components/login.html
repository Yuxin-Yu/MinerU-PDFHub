<div class="auth-form">
    <h2>ログイン</h2>
    <form id="login-form" class="pure-form pure-form-stacked">
        <fieldset>
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>
            
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" placeholder="パスワード" required>
            
            <button type="submit" class="pure-button pure-button-primary">ログイン</button>
        </fieldset>
    </form>
    <p>アカウントをお持ちでない方は <a href="#" hx-get="/components/register.html" hx-target="#main-content" hx-push-url="/register">こちら</a></p>
</div>
