<div class="auth-form">
    <h2>アカウント作成</h2>
    <form id="register-form" class="pure-form pure-form-stacked">
        <fieldset>
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>
            
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" placeholder="パスワード" required>
            
            <label for="organization">組織名</label>
            <input type="text" id="organization" name="organization" placeholder="my-company" pattern="[a-zA-Z0-9-]+" required>
            <small>英数字とハイフンのみ使用可能</small>
            
            <button type="submit" class="pure-button pure-button-primary">アカウント作成</button>
        </fieldset>
    </form>
    <p>既にアカウントをお持ちの方は <a href="#" hx-get="/components/login.html" hx-target="#main-content" hx-push-url="/login">こちら</a></p>
</div>
