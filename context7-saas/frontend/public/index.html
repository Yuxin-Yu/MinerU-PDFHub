<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context7 - Library Documentation Platform</title>
    <meta name="description" content="Context7 - Cloud-based library documentation service">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0066cc">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    
    <!-- PureCSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">
    
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Cash-DOM -->
    <script src="https://cdn.jsdelivr.net/npm/cash-dom@8.1.5/dist/cash.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="pure-menu pure-menu-horizontal">
                <a href="/" class="pure-menu-heading pure-menu-link">Context7</a>
                <ul class="pure-menu-list">
                    <li class="pure-menu-item">
                        <a href="#" class="pure-menu-link" hx-get="/components/search.html" hx-target="#main-content" hx-push-url="/search">検索</a>
                    </li>
                    <li class="pure-menu-item" id="auth-menu">
                        <a href="#" class="pure-menu-link" hx-get="/components/login.html" hx-target="#main-content" hx-push-url="/login">ログイン</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    
    <!-- Main Content -->
    <main id="main-content" class="container">
        <div class="hero">
            <h1>Context7</h1>
            <p>プライベートライブラリのドキュメント管理プラットフォーム</p>
            <div class="hero-actions">
                <button class="pure-button pure-button-primary" hx-get="/components/search.html" hx-target="#main-content" hx-push-url="/search">
                    ライブラリを検索
                </button>
                <button class="pure-button" hx-get="/components/register.html" hx-target="#main-content" hx-push-url="/register">
                    アカウント作成
                </button>
            </div>
        </div>
        
        <!-- Features -->
        <div class="features pure-g">
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="feature-card">
                    <h3>🔍 高速検索</h3>
                    <p>WebAssemblyによる高速な検索とスコアリング</p>
                </div>
            </div>
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="feature-card">
                    <h3>🔒 セキュア</h3>
                    <p>組織ごとに分離されたプライベートドキュメント</p>
                </div>
            </div>
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="feature-card">
                    <h3>📱 PWA対応</h3>
                    <p>オフラインでも使用可能なプログレッシブウェブアプリ</p>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Context7. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- App JavaScript -->
    <script src="/js/app.js"></script>
</body>
</html>
